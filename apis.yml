aid: viso-trust
name: VISO Trust
description: VISO TRUST is an AI-powered third-party risk management (TPRM) platform that helps security
  teams assess and continuously monitor vendor risk across third, fourth, and nth parties. Its Artifact
  Intelligence AI engine reads vendor security documentation to automate assessments, and the platform
  covers vendor onboarding, questionnaires, external intelligence reports (SecurityScorecard, Recorded
  Future, BitSight), risk scoring, audit logging, and a VISO Chat agent. The public Client API (v1) exposes
  relationships, assessments, vendor risk summaries, questionnaires, users, and webhooks over HTTPS with
  bearer-token auth.
